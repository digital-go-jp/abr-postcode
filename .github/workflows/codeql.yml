name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (Go)
    # Uploading results needs code scanning, which a private repository only
    # gets with GitHub Advanced Security. Skip rather than fail until the
    # repository is public, so a genuine failure still stands out.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4.37.5
        with:
          languages: go
      - uses: github/codeql-action/autobuild@v4.37.5
      - uses: github/codeql-action/analyze@v4.37.5
        with:
          category: "/language:go"
